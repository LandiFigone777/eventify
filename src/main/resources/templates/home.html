<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/toast.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/custom.css">
    <!-- Bootstrap 5 JS (opzionale per dropdown/toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

</head>
<body>
<div id="toast" class="toast"
th:if="${msg}"
th:text="${msg}">
</div>
<div th:replace="~{fragments/navbar :: navbar(content=~{fragments/homeContent :: content}, activePage='home')}"></div><br>
<br>
<br>
</div>
<script>
    function subscribeToEvent(eventId) {
        fetch('/events/subscribe', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ idEvento: eventId })
        })
            .then(response => {
                if (response.ok) {
                    // Reindirizza direttamente alla pagina delle iscrizioni
                    window.location.href = '/subscriptions';
                } else {
                    alert('Errore durante l\'iscrizione.');
                }
            })
            .catch(error => {
                console.error('Errore:', error);
                alert('Errore durante l\'iscrizione.');
            });
    }
</script>
</body>
</html>

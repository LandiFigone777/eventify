<div th:fragment="content">
    <h2 class="mb-4">Eventi a cui sei iscritto</h2>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        <div th:each="evento : ${partecipazioni}" class="col">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="card-title text-primary fw-bold" th:text="${evento.nome}">Nome evento</h5>
                            <h6 class="card-subtitle mb-2 text-muted" th:text="${#temporals.format(evento.dataOraInizio, 'dd MMMM yyyy - HH:mm')}">Data e ora inizio</h6>
                            <h6 class="card-subtitle mb-2 text-muted" th:text="${#temporals.format(evento.dataOraFine, 'dd MMMM yyyy - HH:mm')}">Data e ora fine</h6>
                            <p class="mb-1">
                                <i class="bi bi-geo-alt-fill"></i>
                                <span th:text="${evento.indirizzo + ' ' + evento.numeroCivico}">Indirizzo</span>
                            </p>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-info text-dark" th:text="${evento.etaMinima + '+'}">18+</span>
                        </div>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{'/event/' + ${evento.idEvento}}" class="btn btn-outline-primary btn-sm">Dettagli</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ricerca utenti</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Bootstrap 5 JS (opzionale per dropdown/toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<input type="text" id="filterInput" onkeyup="filter()" placeholder="Cerca per username..." />

<ul id="resultsList">
    <li th:each="username : ${usernames}"><a th:href="'user/' + ${username}" th:text="${username}"></a></li>
</ul>

<script>
    const filterInput = document.getElementById('filterInput');
    const resultsList = document.getElementById('resultsList');
    const items = resultsList.getElementsByTagName('li');

    function filter(){
        const filterValue = filterInput.value.toLowerCase();

        let a, txtValue;

        for (let i = 0; i < items.length; i++) {
            console.log(items.length);
            a = items[i];
            txtValue = a.textContent || a.innerText;
            if (txtValue.toLowerCase().indexOf(filterValue) > -1) {
                a.style.display = "";
            } else {
                a.style.display = "none";
            }
        }
    }
</script>
</body>
</html>

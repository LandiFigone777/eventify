<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verifica</title>
    <link rel="stylesheet" href="/toast.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/custom.css">
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card shadow-sm p-4" style="min-width: 320px; max-width: 600px; width: 100%;">
    <div class="card-body">
        <h4 class="card-title text-primary fw-bold text-center mb-3">Verifica il tuo account</h4>
        <p th:utext="'Il codice è stato inviato all\'indirizzo email: <strong>' + ${utente.email} + '</strong>'"></p>
        <form method="post" action="/verify" id="verifyForm">
            <div class="d-flex justify-content-center gap-2 mb-3">
                <input type="text" class="form-control text-center" name="digit1" maxlength="1" style="width: 50px;" required>
                <input type="text" class="form-control text-center" name="digit2" maxlength="1" style="width: 50px;" required>
                <input type="text" class="form-control text-center" name="digit3" maxlength="1" style="width: 50px;" required>
                <input type="text" class="form-control text-center" name="digit4" maxlength="1" style="width: 50px;" required>
                <input type="text" class="form-control text-center" name="digit5" maxlength="1" style="width: 50px;" required>
                <input type="text" class="form-control text-center" name="digit6" maxlength="1" style="width: 50px;" required>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <button type="submit" class="btn btn-primary w-50">Verifica</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach((input, index) => {
            // Passa al successivo quando si scrive
            input.addEventListener('input', function () {
                if (input.value.length === input.maxLength) {
                    const nextInput = inputs[index + 1];
                    if (nextInput) {
                        nextInput.focus();
                    }
                }
            });

            // Torna al precedente quando si cancella
            input.addEventListener('keydown', function (event) {
                if (event.key === 'Backspace' && input.value === '') {
                    const previousInput = inputs[index - 1];
                    if (previousInput) {
                        previousInput.focus();
                    }
                }
            });
        });
    });
</script>
</body>
</html>

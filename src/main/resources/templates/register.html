<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
    <link rel="stylesheet" href="/toast.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/custom.css">
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card shadow-sm p-4" style="min-width: 320px; max-width: 600px; width: 100%;">
    <div class="card-body">
        <h4 class="card-title text-primary fw-bold text-center mb-3">Crea un nuovo account</h4>
        <form method="post" action="/register" id="registerForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" name="nome" id="nome" placeholder="Inserisci nome" required>
                </div>
                <div class="col-md-6">
                    <label for="cognome" class="form-label">Cognome</label>
                    <input type="text" class="form-control" name="cognome" id="cognome" placeholder="Inserisci cognome" required>
                </div>
                <div class="col-md-6">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" id="username" placeholder="Inserisci username" required>
                </div>
                <div class="col-md-6">
                    <label for="dataNascita" class="form-label">Data di nascita</label>
                    <input type="date" class="form-control" name="dataNascita" id="dataNascita" required>
                </div>
                <div class="col-md-6">
                    <label for="dataNascita" class="form-label">Città di residenza</label>
                    <input type="text" class="form-control" name="citta" id="citta" placeholder="Città di residenza" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" id="email" placeholder="Inserisci email" required>
                </div>
                <div class="col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="password" placeholder="Inserisci password" required>
                </div>
                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label">Conferma Password</label>
                    <input type="password" class="form-control" name="confirmPassword" id="confirmPassword" placeholder="Conferma password" required>
                </div>
                <div class="col-12 d-flex justify-content-center mt-3">
                    <button type="submit" id="registerButton" class="btn btn-primary w-50">Registrati</button>
                    <div id="loadingSpinner" class="spinner-border text-primary" role="status" style="display: none;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </form>
        <div class="mt-3 text-center">
            <p class="mb-0">Hai già un account? <a href="login">Login</a></p>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast position-fixed bottom-0 end-0 m-3" role="alert" aria-live="assertive" aria-atomic="true"
     th:if="${msg}">
    <div class="toast-header">
        <strong class="me-auto">Notifica</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body" th:text="${msg}"></div>
</div>

<script src="/toast.js"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', function (event) {
        event.preventDefault(); // Previene il comportamento predefinito del form

        const registerButton = document.getElementById('registerButton');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // Mostra lo spinner e disabilita il pulsante
        registerButton.style.display = 'none';
        loadingSpinner.style.display = 'inline-block';

        // Raccogli i dati del form
        const formData = new FormData(event.target);
        const data = Object.fromEntries(formData.entries());

        // Invia la richiesta al server
        fetch('/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
            .then(response => {
                if (response.ok) {
                    // Redirezione in caso di successo
                    window.location.href = '/verify';
                } else {
                    return response.json().then(err => {
                        throw new Error(err.message || 'Errore durante la registrazione');
                    });
                }
            })
            .catch(error => {
                console.error('Errore:', error);
                alert(error.message);
            })
            .finally(() => {
                // Nascondi lo spinner e riabilita il pulsante in caso di errore
                loadingSpinner.style.display = 'none';
                registerButton.style.display = 'inline-block';
            });
    });

    document.getElementById('dataNascita').max = new Date().toISOString().split('T')[0];
</script>
</body>
</html>

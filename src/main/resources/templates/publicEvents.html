<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/toast.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/custom.css">
    <!-- Bootstrap 5 JS (opzionale per dropdown/toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Eventi pubblici</h1>
<table>
    <thead>
    <tr>
        <th>Nome Evento</th>
        <th>Data e ora inizio</th>
        <th>Data e ora fine</th>
        <th>Luogo</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="evento : ${eventiPubblici}">
        <td th:text="${evento.nome}"></td>
        <td th:text="${#dates.format(evento.dataOraInizio, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${#dates.format(evento.dataOraFine, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${evento.indirizzo}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>

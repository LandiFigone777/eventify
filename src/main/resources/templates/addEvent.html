<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aggiungi evento</title>
    <link rel="stylesheet" href="/toast.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/custom.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(content=~{fragments/addEventContent :: content}, activePage='addEvent')}"></div><br>



<!--<script src="/trovaInidirzzo.js"></script>-->
<script>
    let map = L.map('map').setView([45.85, 9.4], 13); // inizialmente su Lecco
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker;

    let timeout = null;

    function autocompleteAddress() {
        clearTimeout(timeout);
        timeout = setTimeout(async () => {
            const input = document.getElementById('indirizzo').value;
            if (!input.trim()) return;

            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(input)}&limit=5&addressdetails=1`);
            const suggestions = await response.json();

            console.log('Suggerimenti ricevuti:', suggestions);

            const list = document.getElementById('suggestions');
            list.innerHTML = '';

            suggestions.forEach(item => {
                const li = document.createElement('li');
                li.className = 'list-group-item list-group-item-action';
                li.textContent = item.display_name;

                li.onclick = () => {
                    document.getElementById('indirizzo').value = item.display_name;
                    list.innerHTML = '';
                    list.style.display = 'none';

                    const lat = parseFloat(item.lat);
                    const lon = parseFloat(item.lon);
                    console.log('Updating map with:', lat, lon);
                    updateMap(lat, lon);
                };

                list.appendChild(li);
            });

            list.style.display = suggestions.length > 0 ? 'block' : 'none';
        }, 300);
    }

    function updateMap(lat, lon) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lon]).addTo(map);
        map.setView([lat, lon], 16);
    }
</script>
</body>
</html>
